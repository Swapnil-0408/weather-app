<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet"href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="mainbox mainBox1">
    <img src="images/drizzle.png"/>
    <h1>weather</h1>
    <h2>Forecast</h2>
    <button class="start">Get Started</button>
  </div>
  <div class="mainbox mainBox2 inactive">
  <div class="searchbox">
  <input type="text" placeholder="Search city..." id="inputfield">
  <div class="img">
    <img src="images/search.png" id="searchicon">
  </div>
</div>
<div class="loader inactive" id="loader">
    <div class="spinner"></div>
    <p>Loading...</p>
        </div>
    <div class="iconbox inactive">
      <img src="images/clear.png" id="icon">
      <p id="desc"> description</p>
    </div>
    <div class="tempbox inactive">
      <h1 id="temp">
        0°C
      </h1>
      <h2 id="city">
        newyork
      </h2>
    </div>
    <div class="extradetails inactive">
      <div class="wind">
        <img src="images/wind.png" id="windicon">
        <div class="winddata">
          <p id="windspeed">0km/h   </p>
          <p> wind</p>
        </div>
      </div>
      <div class="humidity">
        <img src="images/humidity.png" id="humidityicon">
        <div class="humiditydata">
          <p id="humidityper">0%</p>
          <p>humidity</p>
        </div>
      </div>
    </div>
  </div>
  <div class="mainbox mainBox3 inactive">
    <h1>404</h1>
    <p>oops page not found</p>
    <button class="homebtn"> Go home</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
